# Gradle 守护进程用 JDK 25（本机没有 21；编译目标仍是 21，见 build.gradle 的 release）。
org.gradle.jvmargs=-Xmx2G

# Loom / Minecraft 国内镜像（BMCLAPI）
loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
loom_experimental_versions=https://maven.fabricmc.net/net/minecraft/experimental_versions.json

# Fabric / Minecraft — 1.21.11（目标运行时 Java 21）
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
# fabric.mod.json 里声明的下限，取 fabric-api 0.141.6+1.21.11 自己的下限。
loader_min_version=0.17.3
fabric_version=0.141.6+1.21.11

# Mod
mod_version=1.1.0
maven_group=yun.shan
archives_base_name=mpsync-1.21.11-fabric
