org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true

minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
# 26.3 线的 NeoForge 还在 -beta 序列（没有 26.2.0.72 那种稳定版），
# 下限写在 minecraft_version_range 里；等稳定版出来再一起改。
# 配套插件必须是 ModDevGradle >= 2.0.147（写在下面的 build.gradle 里）：2.0.144 在
# recompile 原版 net/minecraft/core/HolderSet.java 时会报「contents() ...
# weaker access privileges」，整个 createMinecraftArtifacts 失败，
# 上游 neoforged/NeoForge#3518 的答复就是升级插件。26.2 及更早的模块不受影响。
neo_version=26.3.0.16-beta
neo_version_range=[26.3.0.0,)
loader_version_range=[4,)

mod_id=mpsync
mod_name=MusicParty
mod_license=Apache-2.0
mod_version=1.3.0
mod_group_id=yun.shan
mod_authors=yun.shan
mod_description=Server-side synced listening rooms (MusicParty) - NeoForge 26.3
archives_base_name=mpsync-26.3-neoforge

org.gradle.java.installations.auto-download=false

# Minecraft / NeoForm 走国内镜像（BMCLAPI）：本机 Java 直连 Mojang 会 TLS 失败。
# NeoForm 的版本清单不再覆盖，用默认的官方 piston-meta；
# BMCLAPI 的清单会把 client.jar 指到连不上的自家 CDN。
neoForge.neoFormRuntime.verbose=true
