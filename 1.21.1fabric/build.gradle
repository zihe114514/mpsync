plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// repo.maven.apache.org 在本机既不能直连也不能走代理（同一 URL curl 却是 200，原因未查明），
// 因此把所有 Maven Central 仓库（含 Loom 自己注入的 mavenCentral()）重写到阿里云镜像。
// 与 C:/MUSIC 下各版本客户端工程用的是同一套写法。
def centralHosts = ['repo.maven.apache.org', 'repo1.maven.org', 'repo.maven.org'] as Set
def retargetCentral = { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
            && repo.url != null && centralHosts.contains(repo.url.host)) {
        repo.url = 'https://maven.aliyun.com/repository/public'
    }
}
repositories.all(retargetCentral)
buildscript.repositories.all(retargetCentral)

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

// Shared sources: `core` is the whole room engine + protocol and knows nothing about
// Minecraft, `fabric-common` is the Yarn-named adapter shared by 1.20.1 / 1.21.1 /
// 1.21.11. Only src/main/java of THIS project is version-specific (networking + entry).
sourceSets {
    main {
        java.srcDirs += ['../core/src/main/java', '../fabric-common/src/main/java']
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_min_version", project.loader_min_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_min_version": project.loader_min_version
    }
}

// 目标字节码 21（1.21.1 的运行时），但守护进程是 JDK 25，故只用 release 而不设 toolchain。
def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release.set(targetJavaVersion)
}

java {
    withSourcesJar()
}
