# ForgeGradle 7 + Gradle 9（wrapper 已从 8.14.4 提到 9.6.1）：Forge 61.x 的官方 MDK 就是这套，
# 见 build.gradle 里 plugins 块那段注释。FG6 在这个版本上根本走不通。
#
# 版本清单不覆盖，用构建插件的默认值（官方 piston-meta）。原来指向云端构建机的
# mirror-server.ps1，换成 BMCLAPI 也不行：它的清单会把 client.jar 的下载地址一起改写到
# 自家 CDN（*.749333.xyz），本机连不上；官方 piston-meta / piston-data 实测直连可用。