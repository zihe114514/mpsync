plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
}


version = mod_version
group = mod_group_id
base.archivesName = archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def centralHosts = ['repo.maven.apache.org', 'repo1.maven.org', 'repo.maven.org'] as Set
repositories.all { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && repo.url != null) {
        def host = repo.url.host
        if (centralHosts.contains(host)) {
            repo.url = uri('https://maven.aliyun.com/repository/public')
        // 这里原来把 libraries.minecraft.net 改写到云端构建机的本地镜像。现在不改写：
        // 官方源本机直连可用，而 BMCLAPI 的 jar 会 302 到连不上的 CDN 节点。
        }
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = true
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.console.level', 'info'
        }
        register('server') { args '--nogui' }
        register('client') {}
    }
}

sourceSets {
    main {
        java.srcDirs += ['../core/src/main/java']
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
    // 这里刻意**不挂** BMCLAPI。它作为 com.mojang 的兜底看着很合理，实际是个雷：
    // pom 请求会 302 到 https://<n>.749333.xyz/download/<hash>...，那个主机名是动态的、本机也连不上；
    // Gradle 一旦在某个仓库上失败就会把它整个禁用，接着 authlib / jtracy 全线解析不了
    // （实测报错：Repository maven2 is disabled due to earlier error）。
    // 官方 libraries.minecraft.net 在 build-all.ps1 给这个模块注入 JDK hosts 之后是直连 ~1s，够用了。
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.property('replaceProperties', replaceProperties)
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties }
}
